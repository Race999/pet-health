<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>宠物个人档案</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-shell">
  <div class="app" id="app">
    <main id="view" class="view"></main>

    <button class="fab" id="fab" aria-label="快速记录">
      <span class="fab-plus">＋</span>
      <span>记录一下</span>
    </button>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-page="home"><span>⌂</span><b>首页</b></button>
      <button class="tab" data-page="daily"><span>◷</span><b>日常</b></button>
      <button class="tab center-space" aria-hidden="true"></button>
      <button class="tab" data-page="health"><span>♡</span><b>健康</b></button>
      <button class="tab" data-page="profile"><span>◯</span><b>档案</b></button>
    </nav>
  </div>
</div>

<div class="modal-layer" id="modalLayer"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
